upstream my_apps {
	server api-1:5000;
	server api-2:5000;
}
server {
	listen 80;

	location /health {
		proxy_pass http://my_apps;

	        proxy_set_header X-Real-IP $remote_addr;
	        proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded_Proto $scheme;
	}
	location / {
		proxy_pass http://my_apps;
	}
}
